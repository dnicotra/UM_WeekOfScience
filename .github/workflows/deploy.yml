name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Exports every notebook to WebAssembly and merges them into one site behind
      # pages/index.html. See the script for why the export runs in a marimo-only
      # environment.
      - name: Build the site
        run: tools/build_site.sh site

      # The export rewrites the notebooks if numpy/plotly are importable, and the versions it
      # writes cannot be installed in the browser. Checked after the build, since the build is
      # what would do it.
      - name: Guard against pinned dependencies
        run: |
          if grep -nE '(numpy|plotly)==' double_slit.py water_waves.py; then
            echo "::error::Dependencies got pinned. Pyodide ships its own wasm32 numpy, so a pinned version cannot be installed and the page would fail on import. Unpin them in the script headers."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
